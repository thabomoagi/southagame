<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta
			name="description"
			content="Play a quick game of Candy Match while your game gets ready."
		/>
		<title>Getting your game ready</title>
		<link rel="icon" href="/favicon.png" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<link rel="stylesheet" href="/waiting.css" />
		<script src="/waiting.js" defer></script>
	</head>
	<body>
		<main class="waiting-page">
			<header class="page-header">
				<p class="eyebrow">How Southa Are You?</p>
				<p id="intro-message" class="intro">Enjoy Candy Match while your game gets ready.</p>
				<a id="continue-button" class="action-button" href="/home" hidden>
					Continue to the game
				</a>
			</header>

			<section class="game-panel" aria-label="Candy Match while you wait">
				<div class="game-info">
					<span>Candy Match</span>
					<span>Score: <strong id="score">0</strong></span>
				</div>

				<canvas
					id="candy-canvas"
					width="400"
					height="400"
					aria-label="Candy Match game board. Tap two adjacent candies to swap them and match 3 or more."
				></canvas>

				<p class="help-text">Tap two adjacent candies to swap.</p>
			</section>

			<section class="server-status" aria-live="polite">
				<p id="status-message">Checking if your game is ready...</p>
				<button id="retry-button" class="action-button" type="button" hidden>Retry</button>
			</section>
		</main>
	</body>
</html>
