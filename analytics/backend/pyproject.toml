[project]
name = "backend"
version = "0.1.0"
description = "Multi-tenant AI knowledge and analytics platform backend"
readme = "README.md"
authors = [
    { name = "Thabo Moagi", email = "tboydaflame@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.2",
    "fastapi>=0.141.1",
    "asyncpg>=0.30.0",
    "psycopg[binary]>=3.3.5",
    "pwdlib[argon2]>=0.3.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.52.4",
]

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Flat layout: the code package is app/ at the project root, not src/backend/.
module-root = ""
module-name = "app"

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff.lint]
# Pinned to ruff's classic set: the newer defaults flag B008 on FastAPI's
# Depends() pattern, which is the framework's documented convention.
select = ["E4", "E7", "E9", "F"]
