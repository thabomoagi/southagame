spring:
    application:
        name: how-southa-ru

    servlet:
        multipart:
            max-file-size: 10MB
            max-request-size: 10MB

    datasource:
        url: ${SPRING_DATASOURCE_URL}
        username: ${SPRING_DATASOURCE_USERNAME}
        password: ${SPRING_DATASOURCE_PASSWORD}

    jpa:
        open-in-view: false
        hibernate:
            ddl-auto: validate
        show-sql: true
        properties:
            hibernate:
                format_sql: true

    flyway:
        enabled: false

    mail:
        host: smtp-relay.brevo.com
        port: 587
        username: ${BREVO_USERNAME}
        password: ${BREVO_PASSWORD}
        properties:
            mail:
                smtp:
                    auth: true
                    starttls:
                        enable: true

server:
    port: ${PORT:8080}
    error:
        include-message: always

jwt:
    secret: ${JWT_SECRET}
    access-expiration-ms: 900000
    refresh-expiration-ms: 604800000

app:
    seed-questions: ${SEED_QUESTIONS:true}
    cors:
        allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}
    upload:
        dir: ${APP_UPLOAD_DIR:/app/uploads}
        url-prefix: ${APP_UPLOAD_URL_PREFIX:/uploads}
    email:
        from: ${APP_EMAIL_FROM}
